<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MecaGest: Formulario de Registro de Nuevos Usuarios</title>
</head>
<body>
    <header>
        <h1>MecaGest</h1>
        <h2>Registro de Nuevos Usuarios</h2>
        <p>Complete los campos para solicitar una cuenta en el sistema.</p>
    </header>

    <main>
        <form action="" method="post">
            <fieldset>
                <legend>Datos Personales</legend>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" placeholder="Paola" required>
                <br>
                <br>
                <label for="apPaterno">Apellido Paterno:</label>
                <input type="text" id="apPaterno" placeholder="Franco">
                <br>
                <br>
            <label for="apMaterno">Apellido Materno:</label>
            <input type="text" id="apMaterno" placeholder="Gregorio">
            <br>
            <br>
            <label for="genero">Género:</label>
            <select id="genero">
                <option value="F">Femenino</option>
                <option value="M">Masculino</option>
                <option value="X">Prefiero no decirlo</option>
            </select>
            <br>
            <br>
            <label for="fechaNacimiento">Fecha de Nacimiento:</label>
            <input type="date" id="fechaNacimiento">
            </fieldset>

            <fieldset>
                <legend>Datos de Contacto</legend>
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" placeholder="pao@gmail.com">
                <br>
                <br>
                <label for="numeroTelefonico">Número Telefónico:</label>
                <input type="tel" id="nuemeroTelefonico" placeholder="(55) 7722-3459">
                <br>
                <br>
                <label for="horarioContacto">Favor de contactar en el horario:</label>
                <input type="time" id="horarioContactoInicio" placeholder="09:00">
                <input type="time" id="horarioContactoFin" placeholder="18:00">
            </fieldset>

            <fieldset>
                <legend>Datos de Acceso</legend>
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" placeholder="paofraa" required>
                <br>
                <br>
                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" placeholder="************" required>
                <br>
                <br>
                <label for="confirmarContrasena">Confirmar Contraseña:</label>
                <input type="password" id="confirmarContrasena" placeholder="**************" required>
            </fieldset>

            <fieldset>
                <legend>Datos de Ubicación</legend>
                <label for="direccion">Dirección:</label>
                <input type="text" id="direccion" placeholder="Calle, Número, Colonia, Ciudad, Estado, Código Postal">
                <br>
                <br>
                <label for="pais">País:</label>
                <input type="text" id="pais" placeholder="México">
                <br>
                <br>
                <label for="estado">Estado:</label>
                <input type="text" id="estado" placeholder="Ciudad de México">
                <br>
                <br>
                <label for="ciudad">Ciudad:</label>
                <input type="text" id="ciudad" placeholder="Ciudad de México">
                <br>
                <br>
                <label for="codigoPostal">Código Postal:</label>
                <input type="text" id="codigoPostal" placeholder="01234">
            </fieldset>
            <br>
            <input type="submit" value="Enviar Solicitud"
        

        </form>
    </main>
    
</body>
</html>
